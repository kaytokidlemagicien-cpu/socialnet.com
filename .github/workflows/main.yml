name: Build SocialNet Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          shopt -s nullglob
          for f in *.html *.css *.js; do cp "$f" www/; done

      - name: Add Android platform
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Enable cleartext HTTP for backend connection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure release signing
        run: |
          cp signing/socialnet-release.keystore android/socialnet-release.keystore

          cat >> android/app/build.gradle <<'EOF'

android {
    signingConfigs {
        release {
            storeFile file("../socialnet-release.keystore")
            storePassword "SNRelease-2026!Ks"
            keyAlias "socialnet"
            keyPassword "SNRelease-2026!Ks"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
EOF

      - name: Exclude duplicate Kotlin stdlib JDK artifacts
        run: |
          cat >> android/app/build.gradle <<'EOF'

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
EOF

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialNet-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
