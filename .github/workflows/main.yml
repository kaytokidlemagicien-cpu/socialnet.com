name: Build SecretNet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build SecretNet Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install

      - name: Prepare SecretNet web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp login.html www/
          cp messages.html www/
          cp friends.html www/
          cp profile.html www/
          cp admin.html www/

          cp style.css www/

          cp common.js www/
          cp login.js www/
          cp messages.js www/
          cp friends.js www/
          cp profile.js www/
          cp admin.js www/
          cp native-config.js www/
          cp native-sms.js www/
          cp pro-media.js www/

          echo "SecretNet web files prepared:"
          find www -maxdepth 1 -type f -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project if needed
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload SecretNet APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretNet-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
