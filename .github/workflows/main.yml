name: Build SocialNet Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r *.html *.css *.js www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx --yes @capacitor/cli add android
          fi

      - name: Configure Android
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST_PATH" ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          if "android:usesCleartextTraffic=" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s, encoding="utf-8")
          PY
          fi

      - name: Sync Capacitor
        run: npx --yes @capacitor/cli sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare release keystore
        run: |
          test -f signing/socialnet-release.keystore
          cp signing/socialnet-release.keystore android/socialnet-release.keystore

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          signing = r'''

          android {
              signingConfigs {
                  release {
                      storeFile file("../socialnet-release.keystore")
                      storePassword "SNRelease-2026!Ks"
                      keyAlias "socialnet"
                      keyPassword "SNRelease-2026!Ks"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          '''

          if "SNRelease-2026!Ks" not in s:
              p.write_text(s + signing, encoding="utf-8")
          PY

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialNet-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
